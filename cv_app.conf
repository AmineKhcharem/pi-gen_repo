# =====================================================================
# Configuration File for Embedded Computer Vision Service (cv-app)
# Location: /etc/cv-app/cv_app.conf
# =====================================================================

# Video device index (/dev/video0 -> 0, /dev/video1 -> 1)
CAMERA_INDEX=0

# Video capture dimensions
FRAME_WIDTH=640
FRAME_HEIGHT=480

# Target frame rate
FPS_TARGET=30

# Feature toggles
ENABLE_SOBEL_EDGES=true
ENABLE_SPECTRAL_FFT=true
